<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Contact. Let's talk. Happy to chat about backend, event-driven systems and legacy modernization. Find me on LinkedIn."><title>Contact. Let's talk. Happy to chat about backend, event-driven systems and legacy modernization. Find me on LinkedIn.</title><defs><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace}@keyframes blink{50%{opacity:.25}}.blink{animation:blink 1.4s steps(1) infinite}@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pop{from{transform:scale(0);opacity:0}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}.rise{animation:rise .6s ease-out both}@keyframes draw{from{stroke-dashoffset:1}}.draw{animation:draw 1.2s cubic-bezier(.65,0,.35,1) both}@keyframes type{from{fill-opacity:0}to{fill-opacity:1}}.type{animation:type .01s steps(1) both}@keyframes flicker{0%,86%,89%,93%,100%{opacity:1}87%{opacity:.3}91%{opacity:.55}}.flicker{animation:flicker 6s linear infinite}@keyframes sweep{0%{transform:translateX(0)}50%,100%{transform:translateX(1400px)}}.sweep{animation:sweep 5s ease-in-out 1.5s infinite}@keyframes breathe{from{opacity:.04}to{opacity:.14}}.breathe{animation:breathe 4s ease-in-out infinite alternate}@keyframes uncover{from{transform:scaleX(1)}}.uncover{transform-box:fill-box;transform-origin:right;transform:scaleX(0);animation:uncover 1s cubic-bezier(.65,0,.35,1) both}.scan{opacity:0;animation:scan 1s cubic-bezier(.65,0,.35,1) both}@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.15,1.6);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.train{display:none}}@keyframes scan{0%{opacity:1;transform:translateX(0)}85%{opacity:1}100%{opacity:0;transform:translateX(303.317px)}}</style><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.75" y="0.75" width="998.5" height="238.5" rx="18" fill="#0D0E10" stroke="#1F2125" stroke-width="1.5"/><g class="rise" style="animation-delay:0.00s"><text class="m" x="52" y="66" font-size="13" fill="#FF8A1F" font-weight="700" letter-spacing="3">CONTACT</text></g><text class="s" x="48" y="124" font-size="52" fill="#F2F3EF" font-weight="800" letter-spacing="-1">Let's talk.</text><rect class="uncover" x="44" y="72" width="303.317" height="70" fill="#0D0E10" style="animation-delay:0.3s;animation-duration:0.8s"/><rect class="scan" x="44" y="80" width="4" height="54" rx="2" fill="#FF8A1F" filter="url(#glow)" style="animation-delay:0.3s;animation-duration:0.8s"/><g class="rise" style="animation-delay:0.90s"><text class="s" x="52" y="160" font-size="17" fill="#A9ACB2">Happy to chat about backend, event-driven systems and legacy modernization.</text></g><g class="pop" style="animation-delay:1.10s"><rect class="ring" x="52" y="180" width="160" height="40" rx="20" fill="none" stroke="#FF8A1F" stroke-width="2"/><rect x="52" y="180" width="160" height="40" rx="20" fill="#FF8A1F"/><text class="s" x="132" y="205.5" font-size="15.5" fill="#08090A" font-weight="700" text-anchor="middle">LinkedIn ↗</text></g><path class="draw" d="M640 120H880" pathLength="1" stroke-dasharray="1" fill="none" stroke="#FF8A1F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.60s;animation-duration:1s"/><g class="train" opacity="0"><rect x="-10" y="-3.75" width="20" height="7.5" rx="3.75" fill="#F2F3