<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Oracle SOA → Spring Boot: Migrated every SOAP service from the Oracle SOA platform to Spring Boot apps, turning SOAP services into REST APIs."><defs><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes flow{to{stroke-dashoffset:-28}}
.flow{stroke-dasharray:4 10;animation:flow 1s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#21262D"/></pattern></defs><rect width="400" height="220" rx="16" fill="#161B22"/><rect width="400" height="220" rx="16" fill="url(#dots)"/><rect x="0.75" y="0.75" width="398.5" height="218.5" rx="16" fill="none" stroke="#30363D" stroke-width="1.5"/><path d="M18,1.5 H382" stroke="#6DB33F" stroke-width="3" stroke-linecap="round"/><rect x="22" y="26" width="44" height="44" rx="10" fill="#6DB33F" fill-opacity="0.15" stroke="#6DB33F" stroke-opacity="0.6"/><text class="mono" x="44.0" y="52.0" text-anchor="middle" font-size="12" font-weight="700" fill="#6DB33F">SOA</text><text class="sans" x="80" y="46" font-size="19" font-weight="700" fill="#E6EDF3">Oracle SOA → Spring Boot</text><text class="mono" x="80" y="67" font-size="12" fill="#8B949E">CAST group · 2023 – 2024</text><text class="sans" x="24" y="104" font-size="15" fill="#C9D1D9">Migrated every SOAP service from the Oracle</text><text class="sans" x="24" y="125" font-size="15" fill="#C9D1D9">SOA platform to Spring Boot apps, turning</text><text class="sans" x="24" y="146" font-size="15" fill="#C9D1D9">SOAP services into REST APIs.</text><line x1="22" y1="168" x2="378" y2="168" stroke="#30363D"/><circle cx="28" cy="192" r="4" fill="#3FB950"/><text class="mono" x="40" y="196" font-size="12" fill="#8B949E">shipped</text><text class="mono" x="376" y="196" text-anchor="end" font-size="12" font-weight="700" fill="#6DB33F">Spring Boot · REST · OpenShift</text></svg>