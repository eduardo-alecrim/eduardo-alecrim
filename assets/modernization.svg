tion:breathe 4s ease-in-out infinite alternate}@keyframes uncover{from{transform:scaleX(1)}}.uncover{transform-box:fill-box;transform-origin:right;transform:scaleX(0);animation:uncover 1s cubic-bezier(.65,0,.35,1) both}.scan{opacity:0;animation:scan 1s cubic-bezier(.65,0,.35,1) both}@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.15,1.6);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.train{display:none}}</style><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.75" y="0.75" width="998.5" height="424.5" rx="18" fill="#0D0E10" stroke="#1F2125" stroke-width="1.5"/><g class="pop" style="animation-delay:0.05s"><path d="M52 25A17 17 0 0 0 52 59Z" fill="#FF8A1F"/><path d="M52 25A17 17 0 0 1 52 59Z" fill="#B4F03C"/><text class="s" x="52" y="48.5" font-size="18" fill="#08090A" font-weight="800" text-anchor="middle">3</text></g><g class="rise" style="animation-delay:0.15s"><text class="s" x="84" y="50" font-size="25" fill="#F2F3EF" font-weight="700">Legacy modernization</text></g><g class="rise" style="animation-delay:0.30s"><text class="m" x="960" y="48" font-size="12" fill="#7C8089" text-anchor="end" letter-spacing="1">5 MIGRATIONS</text></g><line x1="24" y1="80" x2="976" y2="80" stroke="#1F2125"/><g class="rise" style="animation-delay:0.20s"><g class="flicker" style="animation-delay:0.0s"><circle cx="64" cy="133" r="9" fill="#0D0E10" stroke="#7C8089" stroke-width="2.5" stroke-dasharray="3.2 2.6"/><path d="M59 138L69 128" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round"/><text class="s" x="88" y="138" font-size="16" fill="#7C8089" text-decoration="line-through">ASP.NET Web Forms</text></g></g><path d="M300 133H546" stroke="#7C8089" stroke-opacity=".45" stroke-width