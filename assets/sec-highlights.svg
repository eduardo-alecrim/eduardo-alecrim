<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="HIGHLIGHTS"><defs><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes flow{to{stroke-dashoffset:-28}}
.flow{stroke-dasharray:4 10;animation:flow 1s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#21262D"/></pattern></defs><rect x="1" y="8" width="230" height="48" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><rect x="10" y="16" width="32" height="32" rx="8" fill="#58A6FF" fill-opacity="0.15" stroke="#58A6FF" stroke-opacity="0.6"/><text class="mono" x="26" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#58A6FF">03</text><text class="sans" x="56" y="38" font-size="17" font-weight="700" fill="#E6EDF3" letter-spacing="2">HIGHLIGHTS</text><circle cx="231" cy="32" r="4.5" fill="#8B949E"/><path d="M231,32 L1188,32" stroke="#30363D" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M231,32 L1188,32" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/><circle r="4" fill="#58A6FF"><animateMotion dur="7s" begin="-0.00s" repeatCount="indefinite" path="M231,32 L1188,32"/></circle><circle r="4" fill="#58A6FF"><animateMotion dur="7s" begin="-2.33s" repeatCount="indefinite" path="M231,32 L1188,32"/></circle><circle r="4" fill="#58A6FF"><animateMotion dur="7s" begin="-4.67s" repeatCount="indefinite" path="M231,32 L1188,32"/></circle><circle cx="1188" cy="32" r="6" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/></svg>