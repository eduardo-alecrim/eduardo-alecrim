<svg xmlns="http://www.w3.org/2000/svg" width="332" height="48" viewBox="0 0 332 48" role="img" aria-label="Portfolio: eduardo-alecrim.github.io"><title>Portfolio: eduardo-alecrim.github.io</title><defs><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace}@keyframes blink{50%{opacity:.25}}.blink{animation:blink 1.4s steps(1) infinite}@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pop{from{transform:scale(0);opacity:0}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}.rise{animation:rise .6s ease-out both}@keyframes draw{from{stroke-dashoffset:1}}.draw{animation:draw 1.2s cubic-bezier(.65,0,.35,1) both}@keyframes type{from{fill-opacity:0}to{fill-opacity:1}}.type{animation:type .01s steps(1) both}@keyframes flicker{0%,86%,89%,93%,100%{opacity:1}87%{opacity:.3}91%{opacity:.55}}.flicker{animation:flicker 6s linear infinite}@keyframes sweep{0%{transform:translateX(0)}50%,100%{transform:translateX(1400px)}}.sweep{animation:sweep 5s ease-in-out 1.5s infinite}@keyframes breathe{from{opacity:.04}to{opacity:.14}}.breathe{animation:breathe 4s ease-in-out infinite alternate}@keyframes uncover{from{transform:scaleX(1)}}.uncover{transform-box:fill-box;transform-origin:right;transform:scaleX(0);animation:uncover 1s cubic-bezier(.65,0,.35,1) both}.scan{opacity:0;animation:scan 1s cubic-bezier(.65,0,.35,1) both}@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.15,1.6);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.train{display:none}}</style></defs><rect x="0.75" y="0.75" width="330.5" height="46.5" rx="23.25" fill="#0D0E10" stroke="#2C2F35" stroke-width="1.5"/><circle cx="24" cy="24" r="15" fill="#FF8A1F"/><path d="M18.5 29.5 29 19M21.5 18.5H29.5V26.5" fill="none" stroke="#08090A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="s" x="50" y="29.5" font-size="15.5"><tspan font-weight="700" fill="#F2F3EF">Portfolio</tspan><tspan class="m" dx="9" font-size="12" fill="#7C8089">eduardo-alecrim.github.io</tspan></text></svg>
