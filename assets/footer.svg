<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="End of stream, thanks for stopping by"><defs><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes flow{to{stroke-dashoffset:-28}}
.flow{stroke-dasharray:4 10;animation:flow 1s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#21262D"/></pattern></defs><rect width="1200" height="100" rx="16" fill="#0D1117"/><rect width="1200" height="100" rx="16" fill="url(#dots)"/><rect x="0.5" y="0.5" width="1199" height="99" rx="16" fill="none" stroke="#30363D"/><path d="M40,52 L410,52" stroke="#30363D" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M40,52 L410,52" stroke="#F89820" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/><circle r="3.5" fill="#F89820"><animateMotion dur="4s" begin="-0.00s" repeatCount="indefinite" path="M40,52 L410,52"/></circle><circle r="3.5" fill="#F89820"><animateMotion dur="4s" begin="-2.00s" repeatCount="indefinite" path="M40,52 L410,52"/></circle><path d="M790,52 L1160,52" stroke="#30363D" stroke-width="2.5" stroke-linecap="round"/><path class="flow" d="M790,52 L1160,52" stroke="#F89820" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/><circle r="3.5" fill="#F89820"><animateMotion dur="4s" begin="-0.00s" repeatCount="indefinite" path="M790,52 L1160,52"/></circle><circle r="3.5" fill="#F89820"><animateMotion dur="4s" begin="-2.00s" repeatCount="indefinite" path="M790,52 L1160,52"/></circle><circle cx="40" cy="52" r="5" fill="#8B949E"/><circle cx="1160" cy="52" r="6" fill="#0D1117" stroke="#F89820" stroke-width="2"/><text class="mono" x="600" y="50" text-anchor="middle" font-size="14" fill="#C9D1D9"># end of stream · thanks for stopping by</text><text class="mono" x="600" y="72" text-anchor="middle" font-size="12" fill="#8B949E">fim do stream · obrigado pela visita</text></svg>