<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="362" viewBox="0 0 1000 362" role="img" aria-label="Right now. Working on: Backend services at CASSI, one of Brazil's largest self-managed health plans. Building with: Spring Boot, Quarkus and Apache Kafka, deployed on OpenShift. Learning: DDD, Clean Architecture and TDD, in a postgrad in Agile Software Engineering. Previously: CAST group, where I went from junior to senior developer in 15 months."><title>Right now. Working on: Backend services at CASSI, one of Brazil's largest self-managed health plans. Building with: Spring Boot, Quarkus and Apache Kafka, deployed on OpenShift. Learning: DDD, Clean Architecture and TDD, in a postgrad in Agile Software Engineering. Previously: CAST group, where I went from junior to senior developer in 15 months.</title><defs><style>.s{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace}@keyframes blink{50%{opacity:.25}}.blink{animation:blink 1.4s steps(1) infinite}@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pop{from{transform:scale(0);opacity:0}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}.rise{animation:rise .6s ease-out both}@keyframes draw{from{stroke-dashoffset:1}}.draw{animation:draw 1.2s cubic-bezier(.65,0,.35,1) both}@keyframes type{from{fill-opacity:0}to{fill-opacity:1}}.type{animation:type .01s steps(1) both}@keyframes flicker{0%,86%,89%,93%,100%{opacity:1}87%{opacity:.3}91%{opacity:.55}}.flicker{animation:flicker 6s linear infinite}@keyframes sweep{0%{transform:translateX(0)}50%,100%{transform:translateX(1400px)}}.sweep{animation:sweep 5s ease-in-out 1.5s infinite}@keyframes breathe{from{opacity:.04}to{opacity:.14}}.breathe{animation:breathe 4s ease-in-out infinite alternate}@keyframes uncover{from{transform:scaleX(1)}}.uncover{transform-box:fill-box;transform-origin:right;transform:scaleX(0);animation:uncover 1s cubic-bezier(.65,0,.35,1) both}.scan{opacity:0;animation:scan 1s cubic-bezier(.65,0,.35,1) both}@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.15,1.6);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.train{display:none}}</style><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0.75" y="0.75" width="998.5" height="360.5" rx="18" fill="#0D0E10" stroke="#1F2125" stroke-width="1.5"/><g class="pop" style="animation-delay:0.05s"><circle cx="52" cy="42" r="17" fill="#FF8A1F"/><text class="s" x="52" y="48.5" font-size="18" fill="#08090A" font-weight="800" text-anchor="middle">1</text></g><g class="rise" style="animation-delay:0.15s"><text class="s" x="84" y="50" font-size="25" fill="#F2F3EF" font-weight="700">Right now</text></g><line x1="24" y1="80" x2="976" y2="80" stroke="#1F2125"/><path class="draw" d="M64 132V306" pathLength="1" stroke-dasharray="1" fill="none" stroke="#FF8A1F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s;animation-duration:1s"/><g class="train" opacity="0"><rect x="-10" y="-3.75" width="20" height="7.5" rx="3.75" fill="#F2F3EF" filter="url(#glow)"/><animateMotion path="M64,132 V306" rotate="auto" dur="4s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="4s" begin="2.2s" repeatCount="indefinite"/></g><g class="pop" style="animation-delay:0.30s"><circle class="pulse" cx="64" cy="132" r="13" fill="none" stroke